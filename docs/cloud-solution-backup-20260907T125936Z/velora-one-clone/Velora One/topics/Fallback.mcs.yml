mcs.metadata:
  componentName: Fallback
  description: This system topic triggers when the user's utterance does not match any existing topics.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_LktzXw
      conditions:
        - id: conditionItem_tlGIVo
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_QZreqo
              activity: I'm sorry, I'm not sure how to help with that. Can you try rephrasing?

      elseActions:
        - kind: BeginDialog
          id: 5aXj5M
          dialog: new_VeloraExecutiveAgent.topic.Search

        - kind: InvokeFlowAction
          id: invokeFlowAction_pBLzak
          input: {}
          output:
            binding:
              email: Topic.Email

          flowId: cf0245a7-3b97-f111-b8db-7ced8dac2bdc