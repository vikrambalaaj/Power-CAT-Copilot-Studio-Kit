applications:
  - name: productivity-mcp-server
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - python_buildpack
    command: python run_server.py
    routes:
      - route: productivity-mcp-server.cfapps.eu10-005.hana.ondemand.com
    env:
      PYTHONUNBUFFERED: "1"
      VeloraEnvironmentName: Velora-AgenticAD-Dev
      VeloraAuditTableName: cre2f_veloraagentauditlog
      VeloraAuditEnabled: "true"
      VeloraWriteActionsEnabled: "true"
      VeloraExternalEmailEnabled: "true"
      VELORA_CONFIRMATION_EXPIRY_MINUTES: "10"
      VELORA_APPROVAL_HMAC_SECRET_REF: "kv://velora/approval/hmac-secret"
      DATAVERSE_CLIENT_SECRET_REF: "kv://velora/dataverse/client-secret"
      DATAVERSE_URL: "https://org4b098979.crm15.dynamics.com"
      DATAVERSE_AUDIT_ENTITY_SET: "cre2f_veloraagentauditlogs"
      AZURE_TENANT_ID: "7d167021-f5e9-4331-9b75-d44d55a1ce9b"
      AZURE_CLIENT_ID: "5d178cb2-251e-436c-b2ec-5f36021d2cf8"
      MCP_API_KEY_SECRET_REF: "kv://velora/mcp/productivity-api-key"
      PRODUCTIVITY_AUTH_MODE: "entra_delegated"
      DATAVERSE_AUTH_MODE: "client_credentials"
      ALLOWED_HOSTS: "productivity-mcp-server.cfapps.eu10-005.hana.ondemand.com,localhost:*,127.0.0.1:*,*"
      ALLOW_ANONYMOUS: "false"
      CORS_ORIGINS: "*"
