version: '3.8'

services:
  sf-mcp:
    build:
      context: ./ask-successfactors
      dockerfile: Dockerfile
    image: velora-mcp-sf:latest
    container_name: velora-mcp-sf
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - ALLOW_ANONYMOUS=true
      - ALLOWED_HOSTS=*
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    restart: unless-stopped

  s4hana-mcp:
    build:
      context: ./ask-s4hana
      dockerfile: Dockerfile
    image: velora-mcp-s4hana:latest
    container_name: velora-mcp-s4hana
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - ALLOW_ANONYMOUS=true
      - ALLOWED_HOSTS=*
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    restart: unless-stopped

  sac-mcp:
    build:
      context: ./ask-sac
      dockerfile: Dockerfile
    image: velora-mcp-sac:latest
    container_name: velora-mcp-sac
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - ALLOW_ANONYMOUS=true
      - ALLOWED_HOSTS=*
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    restart: unless-stopped

  facilitator-mcp:
    build:
      context: ./ask-facilitator
      dockerfile: Dockerfile
    image: velora-mcp-facilitator:latest
    container_name: velora-mcp-facilitator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ALLOW_ANONYMOUS=true
      - ALLOWED_HOSTS=*
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    restart: unless-stopped

  card-service:
    build:
      context: ./dynamic-adaptive-card-service
      dockerfile: Dockerfile
    image: velora-mcp-card-service:latest
    container_name: velora-mcp-card-service
    ports:
      - "8085:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    restart: unless-stopped

