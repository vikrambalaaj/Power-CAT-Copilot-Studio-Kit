applications:
  - name: sf-hcm-mcp-server
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - python_buildpack
    command: python -m successfactors_mcp
    env:
      PYTHON_VERSION: 3.11.15
      PYTHONUNBUFFERED: "1"
      ALLOWED_HOSTS: "sf-hcm-mcp-server.cfapps.eu10-005.hana.ondemand.com"
      ALLOW_ANONYMOUS: "true"
      ENABLE_MUTATING_TOOLS: "false"
      ENABLE_WIDGET: "false"
      MCP_FILE_LOG: "false"
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "120"
      CACHE_MAX_ENTRIES: "512"
      AGGREGATE_CACHE_TTL_SECONDS: "900"
      AGGREGATE_CACHE_MAX_ENTRIES: "128"
      SF_NATIONALITY_ENTITY: "PerPersonal"
      SF_NATIONALITY_PERSON_ID_FIELD: "personIdExternal"
      SF_NATIONALITY_FIELD: "nationality"
      SF_UAE_NATIONALITY_CODES: "ARE"
      SF_ACTIVE_USER_STATUSES: "t"
      SF_EMIRATISATION_TARGET: "52.0"
      SF_METRIC_RULE_VERSION: "velora-workforce-v2"
      SF_SMALL_GROUP_THRESHOLD: "5"
      ENABLE_PERSONAL_INFO_TOOL: "false"
      PUBLIC_BASE_URL: "https://sf-hcm-mcp-server.cfapps.eu10-005.hana.ondemand.com"
