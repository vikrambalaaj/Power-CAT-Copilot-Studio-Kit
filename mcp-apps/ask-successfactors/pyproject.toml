[project]
name = "sf-hcm-mcp-copilot"
version = "0.5.0"
description = "Ask - SuccessFactors — MCP server + widget for M365 Copilot"
requires-python = ">=3.9"
dependencies = [
    "mcp[cli]==1.26.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
    "starlette>=0.37",
    "structlog>=24.1.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.3.0",
    "cachetools>=5.3.0",
    "cryptography>=46.0.0,<46.0.4",
]

[project.scripts]
sf-hcm-mcp-copilot = "successfactors_mcp.successfactors_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["successfactors_mcp"]
