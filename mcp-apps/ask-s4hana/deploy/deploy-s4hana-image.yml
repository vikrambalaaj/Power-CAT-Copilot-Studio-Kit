name: Build and Publish S4HANA MCP Image

on:
  push:
    branches:
      - main
      - feat/sf-prod-integration
    paths:
      - 'mcp-apps/ask-s4hana/**'
      - '.github/workflows/deploy-s4hana-image.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image Tag'
        required: true
        default: '1.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/velora-mcp-s4hana

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag || '1.0.0' }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image (Azure Compatible)
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-apps/ask-s4hana
          file: ./mcp-apps/ask-s4hana/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
