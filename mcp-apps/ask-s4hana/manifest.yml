applications:
  - name: s4-finance-mcp-server
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - python_buildpack
    command: python -m s4hana_mcp
    env:
      PYTHON_VERSION: 3.11.15
      PYTHONUNBUFFERED: "1"
      ALLOWED_HOSTS: "s4-finance-mcp-server.cfapps.eu10-005.hana.ondemand.com"
      ALLOW_ANONYMOUS: "true"
      S4_API_URL: "https://api.s4hana.ondemand.com/sap/opu/odata/sap"
      S4_AUTH_MODE: "basic"
      S4_USERNAME: "velora_finance"
      S4_PASSWORD: "Password@2026"
      S4_AR_ENTITY: "ZVELORA_AR_AGING_SRV/ReceivablesAgingSet"
      S4_AP_ENTITY: "ZVELORA_AP_AGING_SRV/PayablesAgingSet"
      S4_PL_ENTITY: "ZVELORA_PL_SRV/ProfitAndLossSet"
      S4_BUDGET_ENTITY: "ZVELORA_BUDGET_SRV/BudgetVarianceSet"
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "60"
      CACHE_MAX_ENTRIES: "512"
      OAUTH_TOKEN_CACHE_SKEW_SECONDS: "30"
      PUBLIC_BASE_URL: "https://s4-finance-mcp-server.cfapps.eu10-005.hana.ondemand.com"
