[project]
name = "facilitator-mcp"
version = "1.0.0"
description = "Facilitator MCP Server for Executive Agent"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0,<2.0.0",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "starlette>=0.37",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facilitator_mcp", "shared_mcp", "productivity_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
