name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage approved public content
        run: |
          mkdir -p public_pages
          cp docs/index.html public_pages/
          [ -f docs/.nojekyll ] && cp docs/.nojekyll public_pages/
          [ -d docs/assets ] && cp -r docs/assets public_pages/
          [ -d docs/images ] && cp -r docs/images public_pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_pages
      - id: deployment
        uses: actions/deploy-pages@v4
