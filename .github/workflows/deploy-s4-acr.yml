name: Build and Push S4HANA MCP Image

on:
  push:
    branches:
      - feat/sf-prod-integration
      - main
    paths:
      - "mcp-apps/ask-s4hana/**"
      - ".github/workflows/deploy-s4-acr.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true
        default: "1.1.6"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-apps/ask-s4hana
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/velora-mcp-s4hana:1.1.6
            ghcr.io/${{ github.repository_owner }}/velora-mcp-s4hana:latest

      - name: Azure Login (if credentials available)
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        if: env.AZURE_CREDENTIALS != '' || env.ACR_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: azvelaiagentexecaidevcruaen.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}

      - name: Push to Azure Container Registry
        if: env.ACR_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-apps/ask-s4hana
          push: true
          tags: |
            azvelaiagentexecaidevcruaen.azurecr.io/velora-mcp-s4hana:1.1.6
            azvelaiagentexecaidevcruaen.azurecr.io/velora-mcp-s4hana:latest
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
